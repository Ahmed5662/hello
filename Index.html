
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed | My Personal Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .avatar {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #38bdf8;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(32px, 8vw, 46px);
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #bae6fd;
      margin-bottom: 30px;
    }

    .problem {
      font-size: 16px;
      line-height: 1.8;
      color: #e2e8f0;
      margin-bottom: 30px;
    }

    .date {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      font-size: 14px;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar">A</div>

    <h1>Hello, I'm Ahmed</h1>

    <p class="subtitle">
      MSc student, National College of Ireland
    </p>

    <p class="problem">
      I care about helping FMCG businesses reduce
      inventory waste and improve demand forecasting
      by using artificial intelligence and data analytics.
    </p>

    <div class="date" id="today"></div>

    <footer>
      Learning, Innovation & Business Technology
    </footer>
  </main>

  <script>
    const today = new Date();

    document.getElementById("today").textContent =
      "Today is " +
      today.toLocaleDateString("en-IE", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
  </script>
</body>
</html>
